# .aint.yaml — example configuration for aint.
# Delete or edit freely; aint runs with sane defaults if this file is absent.

fail_on: error   # info|warning|error — findings at/above this exit non-zero
                 # note: several seed checks default to `warning` severity and won't
                 # fail a check run on their own unless overridden here or fail_on
                 # is lowered to `warning`

ignore:
  - vendor/**
  - node_modules/**
  - "*.pb.go"
  # aint dogfoods itself (`aint check .` in this repo). These paths
  # intentionally contain literal "bad" examples to test/document the
  # checks — every hit in them is a self-referential false positive, not
  # a real issue. Real production code lives in cmd/ and internal/*.go.
  - docs/**
  - README.md
  - cmd/aint/testdata/**
  - "*_test.go"

checks:
  {}
  # Example overrides:
  # go-ignored-error: error
  # node-eval: off

docs_base_url: ""  # set to a hosted docs URL once this repo has one;
                    # leave blank to use relative docs/checks/<id>.md links
